spring.application.name=arbnb_softpasty
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace_db}
spring.datasource.username=${DB_USERNAME:marketplace_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.time-zone=${APP_TIME_ZONE:America/Bogota}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:80,http://localhost:5173}
app.security.jwt.issuer=${APP_JWT_ISSUER:arbnb-softpasty}
app.security.jwt.secret-base64=${APP_JWT_SECRET:}
app.security.jwt.access-token-ttl=60m
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.password-reset.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.password-reset.from=${MAIL_FROM:${MAIL_USERNAME:}}

springdoc.swagger-ui.path=/swagger-ui.html
